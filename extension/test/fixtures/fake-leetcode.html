<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Two Sum - LeetCode</title>
  </head>
  <body>
    <!-- A stand-in for a LeetCode problem page: just the controls and traffic the extension touches.
         Its behaviour is fake-leetcode.js; the requests it makes go to LeetCode's real paths. -->
    <div id="__next">
      <div class="header">
        <a href="/problems/two-sum/">1. Two Sum</a>
        <div class="difficulty">Easy</div>
        <a href="/tag/array/">Array</a>
        <a href="/tag/hash-table/">Hash Table</a>
      </div>
      <!-- The streaks pop-over: a Radix [role=dialog] that is no reset modal (it must never pass for one). -->
      <div role="dialog" id="radix-_r_b_" data-state="open" data-fake="streaks">
        0 Streaks <button type="button" class="relative font-medium">Practice</button>
      </div>
      <!-- LeetCode's timer widget, as logged 2026-11-10 (fake-leetcode.js renders it from QD_TIMER_STATE): the
           controls layer (Hide, Pause/Resume, Reset) is always mounted; the opener only while idle. -->
      <div class="timer h-8 rounded-sd bg-fill-tertiary" data-fake="timer"></div>
      <div id="editor">
        <div class="flex h-8 items-center">
          <div class="flex h-full flex-nowrap">
            <button type="button" data-e2e-locator="lang-selector-button" data-e2e-lang="python3">
              Python3
            </button>
          </div>
          <div class="flex h-full items-center" data-fake="toolbar">
            <button type="button" data-fake="icon-1">i</button>
            <button type="button" data-fake="icon-2">i</button>
            <button type="button" data-fake="icon-3">i</button>
            <button type="button" data-fake="reset">⟲</button>
            <button type="button" data-fake="icon-5">i</button>
          </div>
        </div>
        <textarea id="code" data-fake="code"></textarea>
      </div>
      <button type="button" data-e2e-locator="console-run-button">Run</button>
      <button type="button" data-e2e-locator="console-submit-button">Submit</button>
      <a data-fake="next" href="/problems/add-two-numbers/">Next problem</a>
    </div>
    <script src="/fake-leetcode.js"></script>
  </body>
</html>
