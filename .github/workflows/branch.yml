name: Branch

# The full quality gate on every pushed feature-branch commit, before a PR exists: lanes run only the affected tests
# locally (`pnpm gate:fast`) and this run is the full suite, once per push (docs/ops/FEATURE-WORKFLOW.md → phases 5
# and 9; INFRA §9 → Branch runs). The same ci.yml as pr.yml, but its own check names (`branch / …`), so the required
# `ci / …` checks and checked-tree.ts' PR-run lookup never see it. No AWS, no deploy; `dev` stays excluded with main
# (the retired deploy branch: workflow-triggers.test.ts).
on:
  push:
    branches-ignore: [main, dev]

# A newer push to the same branch makes the in-flight run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only, pinned here as in pr.yml. pull-requests: read is what ci.yml's `check` asks for (its secret scan reads a
# PR's commits); a push run doesn't use it, but a caller must grant what the called jobs request.
permissions:
  contents: read
  pull-requests: read

jobs:
  branch:
    uses: ./.github/workflows/ci.yml
