name: Deploy dev (dispatch)

# A feature branch onto the dev stack (docs/ops/CI-BOT.md) — the only way one gets there since dev-cutover retired the
# `dev` branch; the DEV_DEPLOY_ISOLATED check below is the user's pause switch. The bot
# (`pnpm bot deploy-dev`) dispatches this on `ref: main` — main's YAML runs and the feature commit only supplies
# the tree — or, for a branch that changes `.github/`, on that branch, so its own workflows are what run on dev
# (only the user can push workflow changes: the bot has no `workflows` permission). `verify` also prints what merging
# the commit would deploy to each stage and whether main would skip its check, with the same scripts deploy.yml's
# `changes` job runs.
# Two slots in the dev account (INFRA §2): `slot` picks the stack — `dev` (slot A) or `devb` — and the bot's lock decides
# it (refs/locks/dev or refs/locks/devb). Both run in the `dev` environment with the same role and `_DEV` secrets; the
# call job's name tells them apart (`deploy` vs `deploy-b`), which is how the bot's currentBase reads what each serves.
# The run-name is a contract: `deploy-dev <40-hex sha> <key>`. Dispatch returns no run id, so the bot finds
# its run by that title, and dev-e2e's devcheck matches dispatched runs by it (head_sha is the ref's, not sha).
run-name: deploy-dev ${{ inputs.sha }} ${{ inputs.key }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Feature commit to deploy (40-hex)
        required: true
        type: string
      key:
        description: Run key — `<branch>-<base36 time>`, unique per dispatch
        required: true
        type: string
      base:
        description: Commit the slot serves now (the last dispatched sha); empty → origin/main
        required: false
        type: string
        default: ''
      slot:
        description: Which dev stack — dev (slot A) or devb (slot B); the bot's lock decides it
        required: false
        type: string
        default: dev

# One dispatch per slot at a time; the bot's per-slot lock already serializes them. Queue, never cancel.
concurrency:
  group: deploy-dev-dispatch-${{ inputs.slot }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Everything the deploy trusts about the commit, checked before the deploy role is assumed — by main's code on a
  # main-ref dispatch, by the branch's own on a branch-ref one.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # a checkout, a few git checks and the preview's API reads (a walk that stalls times out to `full`)
    permissions:
      contents: read
      deployments: read # the merge preview: each stage's deployment records
      actions: read # the merge preview: the recorded job's steps; the PR run and its steps
      checks: read # the merge preview: the PR head's check runs and the tested-tree annotation
      pull-requests: read # the merge preview: the PR that owns the commit
    outputs:
      mode: ${{ steps.verify.outputs.mode }}
    steps:
      # Fails a fork's pull request, never skips it: a skipped job passes a required check (INFRA §9 → Public repo).
      # Byte-identical in every job; scripts/src/workflow-fork-guard.test.ts pins it and runs it.
      - name: Fork guard
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$EVENT" in
            push | workflow_dispatch) exit 0 ;;
            pull_request) if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then exit 0; fi ;;
          esac
          echo "::error::this repo's workflows don't run for pull requests from forks (or for event '$EVENT')"
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every branch, for the ancestry and on-a-branch checks
      - name: Verify the commit and classify it
        id: verify
        env:
          SHA: ${{ inputs.sha }}
          KEY: ${{ inputs.key }}
          BASE: ${{ inputs.base }}
          SLOT: ${{ inputs.slot }}
          GITHUB_TOKEN: ${{ github.token }}
          # Set to `true` by the user at dev-cutover, once dev ran in its own account under the SCPs; `false` pauses every
          # dispatch. A repository variable: the bot can't set it (the App has no Variables permission).
          DEV_DEPLOY_ISOLATED: ${{ vars.DEV_DEPLOY_ISOLATED }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # The user's pause switch: a dispatched branch runs with no human step, so turning it off must stop them all.
          [ "$DEV_DEPLOY_ISOLATED" = "true" ] || fail "dispatched dev deploys are paused — repository variable DEV_DEPLOY_ISOLATED is not true (docs/ops/CI-BOT.md)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "sha must be 40 lowercase hex"
          [[ "$KEY" =~ ^[A-Za-z0-9._-]{1,100}$ ]] || fail "key must be [A-Za-z0-9._-], at most 100 chars"
          case "$SLOT" in dev|devb) echo "Slot: $SLOT" ;; *) fail "slot must be dev or devb" ;; esac
          git cat-file -e "$SHA^{commit}" 2>/dev/null || fail "$SHA is not on any branch of this repo"
          # Contains main → dev runs what a squash-merge would produce (the old dev-branch rule).
          git merge-base --is-ancestor origin/main "$SHA" || fail "$SHA is behind main — rebase and push first"
          # On a feature branch — not only main, not the dev branch.
          branches=$(git branch -r --contains "$SHA" --format='%(refname:short)' | grep -vxE 'origin/(HEAD|main|master|dev)' || true)
          [ -n "$branches" ] || fail "$SHA is not on a pushed feature branch"
          echo "On: $(echo $branches)"
          # Which YAML runs: on main, main's — so a `.github/` change would silently not be tested; on the commit's
          # own branch (workflow testing), that branch's — so the ref must point exactly at this commit.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git diff --quiet origin/main "$SHA" -- .github \
              || fail "$SHA changes .github/ — dispatch on its branch so its workflows run (pnpm bot deploy-dev does)"
          else
            ref_sha=$(git rev-parse "origin/${GITHUB_REF#refs/heads/}" 2>/dev/null || true)
            [ "$ref_sha" = "$SHA" ] || fail "dispatched on $GITHUB_REF, whose head ($ref_sha) is not $SHA"
          fi
          # Classify against what dev serves now (the checked-out ref's classifier). An unknown base → full.
          base=origin/main
          if [ -n "$BASE" ]; then
            if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then base=$BASE; else base=''; fi
          fi
          if [ -z "$base" ]; then
            mode=full; echo "Base $BASE unknown — full deploy."
          else
            changed=$(git diff --name-only --no-renames "$base" "$SHA")
            echo "Changed vs $base:"; echo "$changed"
            mode=$(printf '%s\n' "$changed" | node scripts/src/classify-changes.ts)
          fi
          case "$mode" in none|app|full) ;; *) fail "classifier returned '$mode'" ;; esac
          # A dispatch always publishes: `none` would leave dev's build marker on the old sha, and the bot and the
          # devcheck wait for this one.
          if [ "$mode" = none ]; then mode=app; fi
          echo "Deploy mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          # A preview, not this dispatch's mode. It says whether a merge would run CDK (read the CDK diff step's resource list first, INFRA §9),
          # and it is the only run of deploy-base.ts against the real API before a merge: main-push classification runs
          # only on main. Read the log lines above this one for that proof, not the modes: a broken walk also prints `full`. API
          # trouble prints `full` with a ::warning; a crash fails here, on purpose. Assigned, so a crash can't be masked.
          merged_dev=$(node scripts/src/deploy-base.ts dev-main "$SHA" --slot dev)
          merged_devb=$(node scripts/src/deploy-base.ts dev-main "$SHA" --slot devb)
          merged_prod=$(node scripts/src/deploy-base.ts prod "$SHA")
          echo "If merged now: dev-main=$merged_dev devb=$merged_devb prod=$merged_prod"
          # The tree-match preview (scripts/src/checked-tree.ts): the open PR whose head is this sha, read the way main's
          # `changes` will read the merged one. It says `skip`/`fixtures` only while the branch sits on main's head and its
          # PR run is green — the only real-API run of the module before a merge.
          merged_check=$(node scripts/src/checked-tree.ts "$SHA")
          echo "If merged now: check=$merged_check"

  deploy:
    needs: [verify]
    if: inputs.slot == 'dev'
    permissions:
      id-token: write
      contents: read
      deployments: read # deploy-stage's job declares it; a caller granting less fails the whole run at startup
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: dev
      mode: ${{ needs.verify.outputs.mode }}
      ref: ${{ inputs.sha }}
      role_arn: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
      aws_region: ${{ vars.AWS_REGION }}
      cert_arn: ${{ vars.CERT_ARN_DEV }}
    secrets:
      origin_secret: ${{ secrets.ORIGIN_SECRET_DEV }}
      device_token: ${{ secrets.DEVICE_TOKEN_DEV }}
      agent_token: ${{ secrets.AGENT_TOKEN_DEV }}
      device_user_id: ${{ secrets.DEVICE_USER_ID_DEV }}

  # Slot B: the same call on the devb stack. No custom domain until CERT_ARN_DEVB is set; no finance schedule ever.
  deploy-b:
    needs: [verify]
    if: inputs.slot == 'devb'
    permissions:
      id-token: write
      contents: read
      deployments: read # deploy-stage's job declares it; a caller granting less fails the whole run at startup
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: devb
      mode: ${{ needs.verify.outputs.mode }}
      ref: ${{ inputs.sha }}
      role_arn: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
      aws_region: ${{ vars.AWS_REGION }}
      cert_arn: ${{ vars.CERT_ARN_DEVB }}
    secrets: # no device_user_id: devb has no finance schedule
      origin_secret: ${{ secrets.ORIGIN_SECRET_DEV }}
      device_token: ${{ secrets.DEVICE_TOKEN_DEV }}
      agent_token: ${{ secrets.AGENT_TOKEN_DEV }}
