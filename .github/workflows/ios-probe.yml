name: iOS probe

# A feasibility probe, on the ios-ci-probe branch only (never main, never a PR, never a fork): how fast can a hosted
# macOS runner go from cold to a real iOS devcheck row (the Home Screen app, signed in as the dev test user)? Every
# knob and step lives in scripts/ci/ios-probe.sh, so the probe iterates by pushing that file. The one secret, the dev
# test user's password, comes from the ios-probe environment (branch policy: ios-ci-probe only) and is typed into
# the sim through `axe type --stdin`, never argv; the device is cached only before sign-in.
on:
  push:
    branches: [ios-ci-probe]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27 # Xcode 27.2 + iOS 27.2 with an iPhone 18 Pro Max: the Mac's own profile (standard runner)
    timeout-minutes: 45
    environment: ios-probe
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3] # three cold runners for the spread; RUNS in the script turns shards off
    steps:
      - name: Fork guard
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$EVENT" in
            push | workflow_dispatch) exit 0 ;;
            pull_request) if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then exit 0; fi ;;
          esac
          echo "::error::this repo's workflows don't run for pull requests from forks (or for event '$EVENT')"
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: keys # the script names this shard's cache keys (restore=… / save=…, either empty)
        run: bash scripts/ci/ios-probe.sh cache-keys >> "$GITHUB_OUTPUT"
        env:
          IOS_PROBE_SHARD: ${{ matrix.shard }}
      - if: steps.keys.outputs.restore != ''
        uses: actions/cache/restore@v6
        with:
          path: .ios-probe-cache
          key: ${{ steps.keys.outputs.restore }}
      - id: probe
        run: bash scripts/ci/ios-probe.sh
        env:
          IOS_PROBE_SHARD: ${{ matrix.shard }}
          DEVCHECK_PASSWORD: ${{ secrets.DEVCHECK_PASSWORD }}
      - if: always() && steps.probe.outputs.cache == 'save' && steps.keys.outputs.save != ''
        uses: actions/cache/save@v6
        with:
          path: .ios-probe-cache
          key: ${{ steps.keys.outputs.save }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-probe-${{ matrix.shard }}
          path: ios-probe-out
          retention-days: 3
          if-no-files-found: warn
