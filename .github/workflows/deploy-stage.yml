name: Deploy stage

# One reusable deploy, parameterised by stage — deploy-dev and deploy-prod were near-identical 60-line
# copies (adding one per-stage secret meant editing two env blocks). The caller (deploy.yml on a main push,
# deploy-dev.yml on a bot dispatch) decides the stage, the change tier (`mode`), the commit (`ref`), and which
# secrets/vars to hand in.
#
# `mode` gates the work:
#   none → nothing is built or deployed (the docs-only fast-path). The job still runs in `environment:`, so
#          GitHub records a deployment that deploys nothing — a vestige of the retired gate (INFRA §9)
#   app  → frontend only: fetch stack outputs, build, S3 sync, health check. No CDK.
#   full → everything: cdk synth/diff/deploy (writes the outputs file) + smoke, then publish + health.
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string # dev | prod
      mode:
        required: true
        type: string # none | app | full
      role_arn:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      cert_arn:
        required: false
        type: string
        default: '' # us-east-1 ACM cert ARN; empty → no custom-domain alias
      device_user_id:
        required: true
        type: string # the stage's Cognito sub (not secret)
      ref:
        required: false
        type: string
        default: '' # commit to check out and deploy; empty → the triggering commit (github.sha)
      lane:
        required: false
        type: string
        default: '' # dev only: '' → the frozen stock bootstrap; devmain → main's freeze-exempt lane (CI-BOT.md → Two lanes)
    secrets:
      origin_secret:
        required: true
      device_token:
        required: true # pin per stage, else each deploy rotates the extension token
      agent_token:
        required: true # pin per stage, else each deploy rotates the MCP agent token (Claude Code re-register)

permissions:
  id-token: write # assume the AWS deploy role via OIDC
  contents: read
  deployments: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bounds how long a rogue branch's code runs on the runner before GitHub kills it (docs/ops/CI-BOT.md → Dev deploy
    # blast radius); the dev OIDC session below matches it, though credentials the job already minted live out their
    # own STS lifetime (an hour at most). A full deploy measures 10–15 min; prod gets more room because a CloudFront
    # change can run long and a killed job leaves CloudFormation mid-update.
    timeout-minutes: ${{ inputs.stage == 'dev' && 30 || 60 }}
    # Scopes the OIDC subject to `…:environment:<stage>` (what the deploy role's trust is bound to) — or, on main's
    # dev lane, `…:environment:dev-main`, an environment GitHub admits only from `main`. Also records a GitHub
    # deployment against it, which nothing consumes since main dropped `required_deployments` (INFRA §9).
    environment: ${{ inputs.lane == 'devmain' && 'dev-main' || inputs.stage }}
    # One deploy per STAGE at a time, across workflows (both dev lanes share the group, so they serialize). A main push (which deploys dev first) and a dev deploy
    # — a `dev` push, or a bot dispatch (deploy-dev.yml) — could otherwise hit the dev stack at once. Queue, never
    # cancel — a half-applied stack is worse than a wait. At most two jobs contend: one main run plus one dev
    # run (dispatches stay off while the `dev` push path exists, and deploy-dev.yml's own group plus the bot's
    # refs/locks/dev lock cap them at one), so GitHub's one-pending-per-group cancellation can't trigger.
    concurrency:
      group: deploy-stage-${{ inputs.stage }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      deployments: read # the prod "never moves backwards" check reads prod's deployment history
    env:
      APERTURE_ORIGIN_SECRET: ${{ secrets.origin_secret }}
      APERTURE_CERT_ARN: ${{ inputs.cert_arn }}
      APERTURE_DEVICE_TOKEN: ${{ secrets.device_token }}
      APERTURE_DEVICE_USER_ID: ${{ inputs.device_user_id }}
      APERTURE_AGENT_TOKEN: ${{ secrets.agent_token }}
      # The commit this deploy serves. A dispatched run's GITHUB_SHA is main's (the workflow ran from main), so
      # the build marker reads this first and falls back to GITHUB_SHA (contract with dev-e2e — CI-BOT.md).
      APERTURE_BUILD_SHA: ${{ inputs.ref || github.sha }}
      # Which CDK bootstrap the dev stacks synthesize against (cdk/src/config/lane.ts); empty everywhere but main's
      # dev deploy.
      APERTURE_DEPLOY_LANE: ${{ inputs.lane }}
    steps:
      - name: Validate mode
        run: |
          case "${{ inputs.mode }}" in
            none|app|full) echo "mode=${{ inputs.mode }} stage=${{ inputs.stage }} lane=${{ inputs.lane }}" ;;
            *) echo "::error::invalid mode '${{ inputs.mode }}'"; exit 1 ;;
          esac
          case "${{ inputs.lane }}" in
            '') ;;
            devmain) [ "${{ inputs.stage }}" = dev ] || { echo "::error::lane devmain is dev-only"; exit 1; } ;;
            *) echo "::error::invalid lane '${{ inputs.lane }}'"; exit 1 ;;
          esac
          # Each lane with its own role, so an unset variable fails here, not as an opaque OIDC trust error.
          case "${{ inputs.lane }}:${{ inputs.role_arn }}" in
            devmain:*:role/aperture-github-dev-main) ;;
            devmain:*) echo "::error::lane devmain needs the dev-main role (is AWS_DEPLOY_ROLE_DEV_MAIN set?)"; exit 1 ;;
            *:role/aperture-github-dev-main) echo "::error::the dev-main role is for lane devmain only"; exit 1 ;;
          esac
      # Prod never moves backwards. Re-running an old successful run (Actions: write can, for 30 days — the bot holds
      # it) would otherwise redeploy that commit to prod with no human step; `prod` has no reviewers. So the commit
      # must be at or ahead of prod's last successful deployment (GitHub records one per `environment: prod` job).
      # Comparing to what prod runs — not to main's head — keeps back-to-back merges working: the older run, queued
      # behind the deploy group, is still ahead of prod and deploys before the newer one. The cost: no rollback by
      # re-run — a revert goes through a PR (docs/ops/CI-BOT.md → Threat model).
      - name: Prod never moves backwards
        if: inputs.stage == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref || github.sha }}
        run: |
          deployed=''
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=prod&per_page=30" --jq '.[].id'); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = success ]; then
              deployed=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq .sha); break
            fi
          done
          if [ -z "$deployed" ]; then echo "No successful prod deployment in the last 30 — nothing to compare."; exit 0; fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$deployed...$SHA" --jq .status)
          echo "prod runs $deployed; this run deploys $SHA ($status)"
          case "$status" in
            ahead|identical) ;;
            *) echo "::error::$SHA is $status prod's $deployed — prod never moves backwards (a re-run of an old run?); revert through a PR"; exit 1 ;;
          esac
      # Shallow — the history-dependent checks (base diff, ancestry) live in the caller, so the deploy itself
      # needs no history. `ref` is a feature commit only on a deploy-dev.yml dispatch: on main, its verify job
      # refused any .github/ change; on a branch ref, this checkout is the YAML's own commit. Either way the local
      # setup action below runs from the code that was verified, under the deploy role.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup # .nvmrc's Node + corepack pnpm + install, same as ci.yml
        if: inputs.mode != 'none'
      - uses: aws-actions/configure-aws-credentials@v6
        if: inputs.mode != 'none'
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-duration-seconds: ${{ inputs.stage == 'dev' && 1800 || 3600 }}
      # --- full only: infra path ---
      # One synth → diff + deploy consume the same cdk.out: no double esbuild bundle, and the diff you
      # read is byte-identical to what deploys. --no-lookups fails loudly on any (unexpected) lookup.
      - name: CDK synth
        if: inputs.mode == 'full'
        run: pnpm --filter @aperture/cdk exec cdk synth ApertureData-${{ inputs.stage }} ApertureApp-${{ inputs.stage }} -c stage=${{ inputs.stage }} --no-lookups --output cdk.out
      # --method=template compares the synthesized template with the deployed one (lookup role) instead of
      # creating a CloudFormation change set — the diff then built a change set and the deploy built a
      # second, identical one. Property-level "requires replacement" still comes from the resource spec;
      # what's lost is CloudFormation's own change-set analysis.
      - name: CDK diff (informational) # no approval pause — this is the visible record of what's changing
        if: inputs.mode == 'full'
        run: pnpm --filter @aperture/cdk exec cdk diff --app cdk.out ApertureData-${{ inputs.stage }} ApertureApp-${{ inputs.stage }} --method=template
      # --method=direct: UpdateStack without a change set. Same rollback-on-failure from CloudFormation, less
      # per-resource progress in the log; unchanged stacks still no-op.
      - name: Deploy stacks # --outputs-file is what publish/health-check read downstream
        if: inputs.mode == 'full'
        run: pnpm --filter @aperture/cdk exec cdk deploy --app cdk.out ApertureData-${{ inputs.stage }} ApertureApp-${{ inputs.stage }} --method=direct --require-approval never --outputs-file cdk-outputs.${{ inputs.stage }}.json
      - name: Smoke
        if: inputs.mode == 'full'
        run: pnpm --filter @aperture/scripts exec tsx src/smoke.ts ${{ inputs.stage }}
      # --- app or full: publish the frontend ---
      # app skipped the deploy that writes the outputs file, so fetch it from CloudFormation instead.
      - name: Fetch stack outputs
        if: inputs.mode == 'app'
        run: node scripts/aws/fetch-stack-outputs.mjs ${{ inputs.stage }}
      - name: Publish frontend
        if: inputs.mode != 'none'
        run: node scripts/aws/publish-frontend.mjs ${{ inputs.stage }}
      # Polls the edge until it serves the shell publish just built, then curls the real public URLs —
      # proves edge wiring + origin-secret gate.
      - name: Post-deploy health check
        if: inputs.mode != 'none'
        run: node scripts/aws/health-check.mjs ${{ inputs.stage }}
