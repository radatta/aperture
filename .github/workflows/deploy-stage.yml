name: Deploy stage

# One reusable deploy, parameterised by stage — deploy-dev and deploy-prod were near-identical 60-line
# copies (adding one per-stage secret meant editing two env blocks). The caller (deploy.yml) decides the
# stage, the change tier (`mode`), and which secrets/vars to hand in.
#
# `mode` gates the work:
#   none → record the deployment only (the job still runs in `environment:`, satisfying the main
#          ruleset's required_deployments; nothing is built or deployed — the docs-only fast-path)
#   app  → frontend only: fetch stack outputs, build, S3 sync, invalidate, health check. No CDK.
#   full → everything: cdk synth/diff/deploy (writes the outputs file) + smoke, then publish + health.
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string # dev | prod
      mode:
        required: true
        type: string # none | app | full
      role_arn:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      cert_arn:
        required: false
        type: string
        default: '' # us-east-1 ACM cert ARN; empty → no custom-domain alias
      device_user_id:
        required: true
        type: string # the stage's Cognito sub (not secret)
    secrets:
      origin_secret:
        required: true
      device_token:
        required: true # pin per stage, else each deploy rotates the extension token

permissions:
  id-token: write # assume the AWS deploy role via OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Records a GitHub deployment against this stage → satisfies `required_deployments: [dev]` on main,
    # AND scopes the OIDC subject to `…:environment:<stage>` (what the deploy role's trust is bound to).
    environment: ${{ inputs.stage }}
    permissions:
      id-token: write
      contents: read
    env:
      APERTURE_ORIGIN_SECRET: ${{ secrets.origin_secret }}
      APERTURE_CERT_ARN: ${{ inputs.cert_arn }}
      APERTURE_DEVICE_TOKEN: ${{ secrets.device_token }}
      APERTURE_DEVICE_USER_ID: ${{ inputs.device_user_id }}
    steps:
      - name: Validate mode
        run: |
          case "${{ inputs.mode }}" in
            none|app|full) echo "mode=${{ inputs.mode }} stage=${{ inputs.stage }}" ;;
            *) echo "::error::invalid mode '${{ inputs.mode }}'"; exit 1 ;;
          esac
      # Shallow — the history-dependent checks (base diff, up-to-date-with-main) live in the caller's
      # `changes` job now, so the deploy itself needs no history.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        if: inputs.mode != 'none'
      - uses: actions/setup-node@v7
        if: inputs.mode != 'none'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: inputs.mode != 'none'
      - uses: aws-actions/configure-aws-credentials@v6
        if: inputs.mode != 'none'
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}
      # --- full only: infra path ---
      # One synth → diff + deploy consume the same cdk.out: no double esbuild bundle, and the diff you
      # read is byte-identical to what deploys. --no-lookups fails loudly on any (unexpected) lookup.
      - name: CDK synth
        if: inputs.mode == 'full'
        run: pnpm --filter @aperture/cdk exec cdk synth ApertureData-${{ inputs.stage }} ApertureApp-${{ inputs.stage }} -c stage=${{ inputs.stage }} --no-lookups --output cdk.out
      - name: CDK diff (informational) # no approval pause — this is the visible record of what's changing
        if: inputs.mode == 'full'
        run: pnpm --filter @aperture/cdk exec cdk diff --app cdk.out ApertureData-${{ inputs.stage }} ApertureApp-${{ inputs.stage }} --method=change-set
      - name: Deploy stacks # --outputs-file is what publish/health-check read downstream
        if: inputs.mode == 'full'
        run: pnpm --filter @aperture/cdk exec cdk deploy --app cdk.out ApertureData-${{ inputs.stage }} ApertureApp-${{ inputs.stage }} --require-approval never --outputs-file cdk-outputs.${{ inputs.stage }}.json
      - name: Smoke
        if: inputs.mode == 'full'
        run: pnpm --filter @aperture/scripts exec tsx src/smoke.ts ${{ inputs.stage }}
      # --- app or full: publish the frontend ---
      # app skipped the deploy that writes the outputs file, so fetch it from CloudFormation instead.
      - name: Fetch stack outputs
        if: inputs.mode == 'app'
        run: node scripts/aws/fetch-stack-outputs.mjs ${{ inputs.stage }}
      - name: Publish frontend
        if: inputs.mode != 'none'
        run: node scripts/aws/publish-frontend.mjs ${{ inputs.stage }}
      - name: Post-deploy health check # curls the real public URLs — proves edge wiring + origin-secret gate
        if: inputs.mode != 'none'
        run: node scripts/aws/health-check.mjs ${{ inputs.stage }}
