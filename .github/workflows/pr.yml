name: PR

# PRs to main run the quality gate only — no AWS, no deploy. Merge to main triggers deploy.yml.
on:
  pull_request:
    branches: [main]

# Cancel superseded runs — a new push to the PR branch makes the in-flight lint/test round moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only, pinned here rather than left to the repo default: ci.yml's jobs each narrow their own grants
# already, but a new job there without its own block would otherwise inherit whatever the default grants.
# pull-requests: read is for `check`'s secret scan, which lists the PR's commits (GET /pulls/{n}/commits).
permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
