name: PR

# PRs to main run the quality gate only — no AWS, no deploy. Merge to main triggers deploy.yml.
on:
  pull_request:
    branches: [main]

# Cancel superseded runs — a new push to the PR branch makes the in-flight lint/test round moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from the root packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
