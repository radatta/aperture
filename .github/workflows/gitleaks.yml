name: Secret scan

# gitleaks scans commits for accidentally-committed secrets. CI-only (no pre-commit hook), free for a
# personal repo (no license key). Full-history scan (fetch-depth: 0); findings fail the job. Suppress false
# positives via a .gitleaksignore at the repo root. Reinforces the "no static creds" posture at the commit
# level — the one leak class OIDC doesn't already prevent (e.g. pasting the origin secret into a file).
on:
  pull_request:
  push:
    branches: [main, dev]

# Cancel superseded runs on the same ref — a new push makes the in-flight scan moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, not just the diff — cheap at this repo size
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # auto-issued token, not a managed secret
