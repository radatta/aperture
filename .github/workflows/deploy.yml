name: Deploy

# GitHub Flow: push to main → dev then prod (both auto — no approval pause, and no merge-time deploy gate:
# the PR's required checks are the only gate before main — INFRA §9). A branch reaches dev only through the bot's
# dispatch, deploy-dev.yml; the `dev` branch push path was retired at dev-cutover (docs/ops/CI-BOT.md → Setup step 8).
# Never add workflow_dispatch or another push branch here: this is the prod path.
# Keyless via OIDC (prod's role from ApertureCicd; dev's from ApertureCicdDev in the dev account — a `main` push
# deploys dev as dev-main's, in the freeze-exempt lane). Origin secret injected from GitHub secrets per stage.
# The actual deploy lives in the reusable deploy-stage.yml; this file orchestrates: classify each stage against what it
# serves, and look up whether a PR run already checked this exact tree → check (all of it, the fixture suite alone, or
# nothing) → wait for each dev slot's lock → deploy each stage at its own tier.
on:
  push:
    branches: [main]

# Serialize deploys per ref — never cancel a deploy mid-flight (a half-applied stack is worse than a queue). A running
# deploy is safe, but GitHub keeps one pending run per group and cancels the older one, jobs and all, when merges
# cluster. Classification doesn't depend on those runs: each stage diffs from what it last deployed. A run waiting for a
# dev lock (wait-dev) is running, never cancelled; merges behind it collapse to the newest, whose wait counts from the
# oldest merge it carries (main-dev-wait.ts), so a supersede never restarts the cap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Classify each stage (docs / app-only / full) against what that stage serves, from its deployment records, and plan
  # the check: `skip` when a green PR run checked this exact tree, `fixtures` when it did but skipped the fixture suite,
  # else `check` (scripts/src/checked-tree.ts; INFRA §9 → Tree-matched main checks). `check` and the deploys wait on it.
  # Kept toolchain-free and short.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # a checkout and a few API reads; a walk that stalls times out to `full`/`check` well inside this
    permissions:
      contents: read
      deployments: read # each stage's deployment records
      actions: read # the recorded job's steps: what that deployment actually deployed; the PR run and its steps
      checks: read # the PR head's check runs and the tested-tree annotation
      pull-requests: read # the PR that introduced the commit
    outputs:
      mode_dev: ${{ steps.detect.outputs.mode_dev }}
      mode_devb: ${{ steps.detect.outputs.mode_devb }}
      mode_prod: ${{ steps.detect.outputs.mode_prod }}
      check: ${{ steps.detect.outputs.check }}
    steps:
      # Fails a fork's pull request, never skips it: a skipped job passes a required check (INFRA §9 → Public repo).
      # Byte-identical in every job; scripts/src/workflow-fork-guard.test.ts pins it and runs it.
      - name: Fork guard
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$EVENT" in
            push | workflow_dispatch) exit 0 ;;
            pull_request) if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then exit 0; fi ;;
          esac
          echo "::error::this repo's workflows don't run for pull requests from forks (or for event '$EVENT')"
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need history to diff from each stage's last deployment
      # docs-only → none (nothing is built or deployed; the deploy job still runs in its environment, so GitHub
      # records a deployment that deploys nothing — a vestige of the retired required_deployments gate, INFRA §9; such a
      # record is never a base). app/** only → app. Anything else, or an indeterminate base → full. The rules are tested
      # modules, not inline shell: scripts/src/deploy-base.ts (what a stage serves) over classify-changes.ts (the tier).
      # Never github.event.before: that is main's previous head, which a failed or cancelled run never deployed.
      # No setup/install (~20s): past each other and bot/api.ts, the modules import only node: builtins, and the runner image's default Node
      # (22.23.2 on ubuntu-24.04 at the time, 22.23.3 by 2026-10-13) strips TypeScript types natively. This
      # job is outside the setup action's .nvmrc guard, but the same run's other jobs fail loudly on a major
      # change. The constraints that puts on the modules are in their headers. `node --version` makes a
      # runner-image Node change diagnosable.
      - name: Classify each stage
        id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --version
          mode_dev=$(node scripts/src/deploy-base.ts dev-main "$GITHUB_SHA" --slot dev)
          # Slot B: full only on a shape change since its last main deploy (cdk/, the lockfile, or shared's stage.ts), else none.
          mode_devb=$(node scripts/src/deploy-base.ts dev-main "$GITHUB_SHA" --slot devb)
          mode_prod=$(node scripts/src/deploy-base.ts prod "$GITHUB_SHA")
          check=$(node scripts/src/checked-tree.ts "$GITHUB_SHA")
          for mode in "$mode_dev" "$mode_devb" "$mode_prod"; do
            case "$mode" in none|app|full) ;; *) echo "::error::classifier returned '$mode'"; exit 1 ;; esac
          done
          case "$check" in skip|fixtures|check) ;; *) echo "::error::checked-tree returned '$check'"; exit 1 ;; esac
          echo "Deploy modes: dev-main=$mode_dev devb=$mode_devb prod=$mode_prod  check=$check"
          { echo "mode_dev=$mode_dev"; echo "mode_devb=$mode_devb"; echo "mode_prod=$mode_prod"; echo "check=$check"; } >> "$GITHUB_OUTPUT"

  # Fail-closed: only a `changes` that succeeded and printed `skip` skips this. A failed or crashed `changes` leaves the
  # output empty, so the check still runs (and nothing deploys: the deploy jobs require `changes` to succeed).
  check:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.check != 'skip' }}
    permissions:
      contents: read
      pull-requests: read # ci.yml's check job declares it (the secret scan); a caller granting less fails at startup
    uses: ./.github/workflows/ci.yml
    with:
      fixtures_only: ${{ needs.changes.outputs.check == 'fixtures' }}

  # A merge never replaces a lane's branch mid-test: each slot's deploy waits while that slot's lock is held and live
  # (scripts/src/main-dev-wait.ts; docs/ops/CI-BOT.md → Dev deploys → A merge waits for the lock). Only once the deploy
  # will happen — `check` green or planned-skipped, as the deploy's own condition — so a red check fails the run at once
  # and the gap between reading "free" and deploying is a runner start. Never a gate: the deploys' `if:`s don't read
  # these results, so a skipped, failed or timed-out wait still deploys — the module itself goes an hour after the later
  # of the oldest merge riding in this run and the holder's taking of the lock (15–60 min after the wait starts), or
  # after ~5 min of failed reads, and says so in a ::warning:: and the summary. Read-only (contents, actions: read); the
  # bot keeps other branches off the slot from the moment this wait starts until its deploy is done (main-pending.ts).
  # Skipped when the slot gets nothing: a docs-only `none` touches no stack.
  wait-dev:
    needs: [changes, check]
    if: ${{ !cancelled() && needs.changes.outputs.mode_dev != 'none' && needs.changes.result == 'success' && (needs.check.result == 'success' || (needs.check.result == 'skipped' && needs.changes.outputs.check == 'skip')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70 # the module's 60-minute ceiling plus a checkout; past it the job ends cancelled → quiet-failure
    permissions:
      contents: read # the lock ref and its tag
      actions: read # main's Deploy runs and their jobs: the cap counts from the oldest merge riding in this run
    steps:
      # Fails a fork's pull request, never skips it: a skipped job passes a required check (INFRA §9 → Public repo).
      # Byte-identical in every job; scripts/src/workflow-fork-guard.test.ts pins it and runs it.
      - name: Fork guard
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$EVENT" in
            push | workflow_dispatch) exit 0 ;;
            pull_request) if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then exit 0; fi ;;
          esac
          echo "::error::this repo's workflows don't run for pull requests from forks (or for event '$EVENT')"
          exit 1
      - uses: actions/checkout@v7
      - name: Wait for the dev lock
        timeout-minutes: 65
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/src/main-dev-wait.ts dev

  # Slot B's twin, only when deploy-devb runs (a shape change); independent of wait-dev, so a held devb never delays
  # this run's dev or prod — but it keeps the run in progress, so the next merge's whole run queues behind it (CI-BOT.md).
  wait-devb:
    needs: [changes, check]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.changes.outputs.mode_devb == 'full' && needs.changes.result == 'success' && (needs.check.result == 'success' || (needs.check.result == 'skipped' && needs.changes.outputs.check == 'skip')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70 # as wait-dev's
    permissions:
      contents: read # the lock ref and its tag
      actions: read # as wait-dev's
    steps:
      # Fails a fork's pull request, never skips it: a skipped job passes a required check (INFRA §9 → Public repo).
      # Byte-identical in every job; scripts/src/workflow-fork-guard.test.ts pins it and runs it.
      - name: Fork guard
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$EVENT" in
            push | workflow_dispatch) exit 0 ;;
            pull_request) if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then exit 0; fi ;;
          esac
          echo "::error::this repo's workflows don't run for pull requests from forks (or for event '$EVENT')"
          exit 1
      - uses: actions/checkout@v7
      - name: Wait for the devb lock
        timeout-minutes: 65
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/src/main-dev-wait.ts devb

  # `check` succeeded, or was skipped because `changes` said so — a check skipped for any other reason deploys nothing.
  # Explicit results, not the implicit success(), which a skipped `check` would fail. `wait-dev` is in `needs` for its
  # order only: the `if:` never reads it.
  deploy-dev:
    needs: [check, changes, wait-dev]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.check.result == 'success' || (needs.check.result == 'skipped' && needs.changes.outputs.check == 'skip')) }}
    permissions:
      id-token: write
      contents: read
      deployments: read # deploy-stage's job declares it; a caller granting less fails the whole run at startup
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: dev
      mode: ${{ needs.changes.outputs.mode_dev }}
      # Two lanes into the dev account (docs/ops/CI-BOT.md → Two lanes): a `main` push is merged, reviewed code, so it
      # deploys through the freeze-exempt devmain lane and its main-only `dev-main` environment. Main is this file's
      # only trigger; the conditionals stay so a trigger ever added here lands in the frozen lane, never the exempt one.
      lane: ${{ github.ref == 'refs/heads/main' && 'devmain' || '' }}
      role_arn: ${{ github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_DEV_MAIN || vars.AWS_DEPLOY_ROLE_DEV }}
      aws_region: ${{ vars.AWS_REGION }}
      cert_arn: ${{ vars.CERT_ARN_DEV }}
    secrets:
      origin_secret: ${{ secrets.ORIGIN_SECRET_DEV }}
      device_token: ${{ secrets.DEVICE_TOKEN_DEV }}
      agent_token: ${{ secrets.AGENT_TOKEN_DEV }}
      device_user_id: ${{ secrets.DEVICE_USER_ID_DEV }}

  # Slot B (devb, the dev account's second stack — INFRA §2) through the same freeze-exempt lane, only when a merge
  # changed its shape: a dispatch onto devb is accepted only if devb already runs main's shape, and every dispatch
  # brings devb's code to its branch anyway (docs/ops/CI-BOT.md → Dev slots). Parallel to deploy-dev and never
  # gating prod; skipped otherwise (a skipped job bills nothing). The job name is a contract: deploy-base.ts and the
  # bot's currentBase tell devb's records by it. `wait-devb` orders it, as wait-dev does deploy-dev.
  deploy-devb:
    needs: [check, changes, wait-devb]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.changes.outputs.mode_devb == 'full' && needs.changes.result == 'success' && (needs.check.result == 'success' || (needs.check.result == 'skipped' && needs.changes.outputs.check == 'skip')) }}
    permissions:
      id-token: write
      contents: read
      deployments: read # deploy-stage's job declares it; a caller granting less fails the whole run at startup
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: devb
      mode: full
      # The same lane guard as deploy-dev's, though the job's `if:` already stops anything but a main push.
      lane: ${{ github.ref == 'refs/heads/main' && 'devmain' || '' }}
      role_arn: ${{ github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_DEV_MAIN || vars.AWS_DEPLOY_ROLE_DEV }}
      aws_region: ${{ vars.AWS_REGION }}
      cert_arn: ${{ vars.CERT_ARN_DEVB }}
    secrets: # no device_user_id: devb has no finance schedule
      origin_secret: ${{ secrets.ORIGIN_SECRET_DEV }}
      device_token: ${{ secrets.DEVICE_TOKEN_DEV }}
      agent_token: ${{ secrets.AGENT_TOKEN_DEV }}

  deploy-prod:
    needs: [deploy-dev, changes] # `changes` listed so this job can read its `mode_prod` output
    # main is the only trigger; the ref test stays so a trigger ever added here stops at dev. Results spelled out: an
    # upstream skipped `check` (a tree match) must not read as a failure through the implicit success().
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.deploy-dev.result == 'success' && needs.changes.result == 'success' }}
    permissions:
      id-token: write
      contents: read
      deployments: read # deploy-stage's prod never-backwards check
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: prod
      mode: ${{ needs.changes.outputs.mode_prod }}
      role_arn: ${{ vars.AWS_DEPLOY_ROLE_PROD }}
      aws_region: ${{ vars.AWS_REGION }}
      cert_arn: ${{ vars.CERT_ARN_PROD }}
    secrets:
      origin_secret: ${{ secrets.ORIGIN_SECRET_PROD }}
      device_token: ${{ secrets.DEVICE_TOKEN_PROD }}
      agent_token: ${{ secrets.AGENT_TOKEN_PROD }}
      device_user_id: ${{ secrets.DEVICE_USER_ID_PROD }} # a prod environment secret, like the three above

  # GitHub's failed-run notice to the merger is the only failure signal (INFRA §9), and two outcomes would slip past it:
  # a main push that classified fine but deployed nothing to dev with no job failing (a skipped `check` that wasn't
  # planned, or a result the deploy guards don't expect), and a job that ended `cancelled` — a deploy job past its
  # timeout, say, mid-CloudFormation — which may leave the run `cancelled` rather than failed. This job fails in both,
  # under always() so a cancelled run can't skip it. A skipped job bills nothing; a failed check already fails the run.
  quiet-failure:
    needs: [changes, check, wait-dev, wait-devb, deploy-dev, deploy-devb, deploy-prod]
    if: ${{ always() && ((!cancelled() && needs.changes.result == 'success' && needs.deploy-dev.result == 'skipped' && needs.check.result != 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Fails a fork's pull request, never skips it: a skipped job passes a required check (INFRA §9 → Public repo).
      # Byte-identical in every job; scripts/src/workflow-fork-guard.test.ts pins it and runs it.
      - name: Fork guard
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$EVENT" in
            push | workflow_dispatch) exit 0 ;;
            pull_request) if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then exit 0; fi ;;
          esac
          echo "::error::this repo's workflows don't run for pull requests from forks (or for event '$EVENT')"
          exit 1
      - name: Fail the run
        env:
          RESULTS: changes=${{ needs.changes.result }} check=${{ needs.check.result }} wait-dev=${{ needs.wait-dev.result }} wait-devb=${{ needs.wait-devb.result }} dev=${{ needs.deploy-dev.result }} devb=${{ needs.deploy-devb.result }} prod=${{ needs.deploy-prod.result }} plan=${{ needs.changes.outputs.check }}
        run: |
          echo "::error::a job was cancelled, or dev was skipped with nothing failing — $RESULTS"
          exit 1
