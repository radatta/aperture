name: Deploy

# GitHub Flow: push to main → dev then prod (both auto — no approval pause; the dev-deployment gate on
# the main ruleset is the safety valve). Push to dev → one-off dev deploy.
# Keyless via OIDC (roles from ApertureCicd). Origin secret injected from GitHub secrets per stage.
# The actual deploy lives in the reusable deploy-stage.yml; this file orchestrates: check → classify
# changes → deploy each stage at the resulting tier.
on:
  push:
    branches: [main, dev]

# Serialize deploys per ref — never cancel a deploy mid-flight (a half-applied stack is worse than a queue).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # Classify the push once (docs / app-only / full) and assert dev is current with main. Runs in
  # parallel with `check`, off the critical path — deploy-dev waits on both anyway.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need history to diff the push and to check ancestry against main
      # On any non-main push (i.e. dev), require the branch to already contain main. This is the
      # chokepoint for the merge gate: you push here to record the dev deployment that
      # `required_deployments:[dev]` needs, then PR that same SHA to main — so if it's current with main
      # now, the PR is inherently up to date. A stale branch fails here → no dev deployment recorded →
      # the gate stays closed. No-op on main pushes (HEAD already is main).
      - name: Branch is up to date with main
        if: github.ref != 'refs/heads/main'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "::error::dev is behind main — merge/rebase main in before pushing"; exit 1
          }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # docs-only → none (deploy job still runs in its environment, so the deployment is still recorded
      # for the merge gate — nothing is actually deployed). app/** only → app. Anything else, or an
      # indeterminate base → full. The rule is a tested module, not an inline regex (see the classifier).
      - name: Classify deployable changes
        id: detect
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "mode=full" >> "$GITHUB_OUTPUT"; echo "No usable base — full deploy."; exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "Changed files:"; echo "$changed"
          mode=$(printf '%s\n' "$changed" | pnpm --silent --filter @aperture/scripts exec tsx src/classify-changes.ts)
          echo "Deploy mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  deploy-dev:
    needs: [check, changes]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: dev
      mode: ${{ needs.changes.outputs.mode }}
      role_arn: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
      aws_region: ${{ vars.AWS_REGION }}
      cert_arn: ${{ vars.CERT_ARN_DEV }}
      device_user_id: ${{ vars.DEVICE_USER_ID_DEV }}
    secrets:
      origin_secret: ${{ secrets.ORIGIN_SECRET_DEV }}
      device_token: ${{ secrets.DEVICE_TOKEN_DEV }}

  deploy-prod:
    needs: [deploy-dev, changes] # `changes` listed so this job can read its `mode` output
    if: github.ref == 'refs/heads/main' # dev-branch pushes stop at dev
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: prod
      mode: ${{ needs.changes.outputs.mode }}
      role_arn: ${{ vars.AWS_DEPLOY_ROLE_PROD }}
      aws_region: ${{ vars.AWS_REGION }}
      cert_arn: ${{ vars.CERT_ARN_PROD }}
      device_user_id: ${{ vars.DEVICE_USER_ID_PROD }}
    secrets:
      origin_secret: ${{ secrets.ORIGIN_SECRET_PROD }}
      device_token: ${{ secrets.DEVICE_TOKEN_PROD }}

  # Push a deploy result to ntfy (subscribed in a desktop browser) so a solo operator gets an out-of-band
  # signal without watching the Actions tab. Runs for both main and dev pushes. Failure = high priority
  # (breaks through), success = min priority (quiet). NTFY_TOPIC is the only access control on the public
  # ntfy instance → a secret, not a var; not an AWS cred, so this job stays keyless. No-ops (doesn't fail)
  # until the secret is set, so it's safe to land before the topic exists.
  notify:
    needs: [check, changes, deploy-dev, deploy-prod]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHECK_RESULT: ${{ needs.check.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DEV_RESULT: ${{ needs.deploy-dev.result }}
          PROD_RESULT: ${{ needs.deploy-prod.result }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC unset — skipping notification."; exit 0; fi
          # Fail if any pipeline job failed or was cancelled. `skipped` is fine — prod is skipped on a
          # dev-branch push, and a docs-only fast-path job still reports success (steps just no-op).
          # `changes` is watched too: it holds the up-to-date-with-main gate, so its failure must not
          # slip through as a success just because the deploy jobs got skipped.
          failed=0
          for r in "$CHECK_RESULT" "$CHANGES_RESULT" "$DEV_RESULT" "$PROD_RESULT"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then failed=1; fi
          done
          body="check=$CHECK_RESULT changes=$CHANGES_RESULT dev=$DEV_RESULT prod=$PROD_RESULT  $SHA"
          if [ "$failed" = "1" ]; then
            curl -s -H "Title: ❌ Aperture deploy FAILED ($REF)" -H "Priority: high" -H "Tags: warning" \
              -d "$body  $RUN_URL" "https://ntfy.sh/$NTFY_TOPIC" || echo "ntfy post failed (non-fatal)"
          else
            curl -s -H "Title: ✅ Aperture deploy ok ($REF)" -H "Priority: min" \
              -d "$body" "https://ntfy.sh/$NTFY_TOPIC" || echo "ntfy post failed (non-fatal)"
          fi
