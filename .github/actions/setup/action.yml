name: Setup
description: The runner image's Node 22 + pnpm via corepack, the pnpm store cache, and a frozen install.

# One recipe for every job that installs (ci.yml's jobs, deploy-stage.yml). Replaces setup-node +
# pnpm/action-setup, which cost 10–20s a job: action-setup installs a current pnpm, then self-updates to
# the pinned one. corepack reads `packageManager`, so pnpm's version keeps its one source. The guards fail
# loudly the day the image's default Node stops matching .nvmrc — the fix then is a deliberate one
# (setup-node back, or bump .nvmrc), not a silent major bump. Actions sets CI, so corepack never prompts;
# if npm rotates its signing keys again, COREPACK_INTEGRITY_KEYS=0 is the break-glass.
# Callers check out first: a local action is read from the workspace.
runs:
  using: composite
  steps:
    - name: Toolchain
      id: toolchain
      shell: bash
      run: |
        corepack enable && corepack install
        node --version && pnpm --version
        [ "$(node -p 'process.versions.node.split(".")[0]')" = "$(cut -d. -f1 .nvmrc)" ] || { echo "::error::runner Node is not .nvmrc's major"; exit 1; }
        [ "$(pnpm --version)" = "$(node -p 'require("./package.json").packageManager.split("@")[1]')" ] || { echo "::error::pnpm is not the packageManager version"; exit 1; }
        echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    # The store cache setup-node used to manage: keyed on the lockfile alone (one file, so hashFiles is
    # cheap), saved only on a miss. A miss is a cold install, never a wrong one.
    - uses: actions/cache@v6
      with:
        path: ${{ steps.toolchain.outputs.store }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - run: pnpm install --frozen-lockfile
      shell: bash
