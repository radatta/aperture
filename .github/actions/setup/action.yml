name: Setup
description: Node from .nvmrc (setup-node) + pnpm via corepack, and a frozen install.

# One recipe for every job that installs (ci.yml's jobs, deploy-stage.yml). Replaces setup-node +
# pnpm/action-setup, which cost 9–15s a job against corepack's 3–4s: action-setup installs a current pnpm,
# then self-updates to the pinned one. corepack reads `packageManager`, so pnpm's version keeps its one
# source. Node itself comes from setup-node reading .nvmrc: the image's default Node was used until
# 2026-10-30, when ubuntu-latest moved to Node 24 and the guard below failed every job. Tests run on
# .nvmrc's major, the Lambda runtime's, whatever the image ships; setup-node's own caching stays off. Actions sets CI, so
# corepack never prompts; if npm rotates its signing keys again, COREPACK_INTEGRITY_KEYS=0 is the
# break-glass. No pnpm store cache: measured, its 4–6s restore bought nothing — install took 10–12s
# from the cache or straight from the registry (INFRA §9). The two problem matchers are setup-node's own
# (MIT, copied verbatim): they turn tsc and ESLint (stylish) errors into inline PR annotations, which
# setup-node used to register.
# Callers check out first: a local action is read from the workspace. Dependabot doesn't scan this file;
# a `uses:` added here needs its own entry (CICD_HARDENING.md item 4).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    - name: Toolchain
      shell: bash
      run: |
        echo "::add-matcher::$GITHUB_ACTION_PATH/tsc.json"
        echo "::add-matcher::$GITHUB_ACTION_PATH/eslint-stylish.json"
        corepack enable
        corepack install
        node --version && pnpm --version
        [ "$(node -p 'process.versions.node.split(".")[0]')" = "$(cut -d. -f1 .nvmrc)" ] || { echo "::error::runner Node is not .nvmrc's major"; exit 1; }
        [ "$(pnpm --version)" = "$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')" ] || { echo "::error::pnpm is not the packageManager version"; exit 1; }
    - run: pnpm install --frozen-lockfile
      shell: bash
