# The COI container's tmux: a Nord status bar with the dev-lock holder. ~/.tmux.conf symlinks here
# (docs/ops/COI-SANDBOX.md → tmux); after an edit, `tmux source ~/.tmux.conf`.
# Palette: nord0 #2E3440 · nord1 #3B4252 · nord3 #4C566A · nord4 #D8DEE9 · nord6 #ECEFF4
#          nord8 #88C0D0 · nord10 #5E81AC · nord13 #EBCB8B (amber) · nord11 #BF616A (red)
set -g status-position top
set -g status-interval 15
set -g renumber-windows on
# Panes get COLORTERM, so apps that read it (Claude Code) draw 24-bit (docs/ops/COI-SANDBOX.md → tmux)
set-environment -g COLORTERM truecolor

set -g status-style "bg=#2E3440,fg=#4C566A"

# Left: fixed label (session name stays COI's)
set -g status-left-length 20
set -g status-left "#[bg=#88C0D0,fg=#2E3440,bold] aperture #[default] "

# Right: the dev-lock holder from the session board, then the time
set -g status-right-length 40
set -g status-right "#[fg=#81A1C1]#(bash /workspace/scripts/board/board.sh status 2>/dev/null | sed -n 's/^dev lock: \\([^ ]*\\).*/dev: \\1/p') #[fg=#4C566A]%a %H:%M "

# Windows: no flags; current window lifted; a bell is an amber dot
set -g window-status-separator ""
set -g window-status-format " #I #W#{?window_bell_flag, #[fg=#EBCB8B]●#[default],} "
set -g window-status-current-format "#[bg=#3B4252,fg=#ECEFF4,bold] #I #W "
set -g monitor-bell on
set -g bell-action other
set -g window-status-bell-style "fg=#EBCB8B,bold"

# Same palette for the rest of tmux
set -g pane-border-style "fg=#3B4252"
set -g pane-active-border-style "fg=#5E81AC"
set -g message-style "bg=#3B4252,fg=#ECEFF4"
set -g mode-style "bg=#5E81AC,fg=#ECEFF4"

# Keys (docs/ops/COI-SANDBOX.md → tmux). Prefix Ctrl-a (screen's); Ctrl-a a sends a real Ctrl-a to the shell.
set -g prefix C-a
unbind C-b
bind a send-prefix
# Ctrl-a t: the control tower over any window, full size and borderless (-B) so nothing behind
# shows; q closes it. Without tower.sh it says so.
bind t display-popup -E -B -w 100% -h 100% 'f=/workspace/scripts/board/tower.sh; if [ -e "$f" ]; then exec bash "$f"; else echo "The tower is not on main yet (board-web). Enter closes."; read _; fi'
# Ctrl-a g: the hub, by name (numbers shift with renumber-windows)
bind g select-window -t '=dispatch'
# Ctrl-a j: fuzzy-jump to any window by name (fzf: au3 finds auto-3), selected by its id (@3), so a name with
# quotes, "." or ":" still works. One #: display-popup doesn't expand formats (run-shell would, needing ##).
bind j display-popup -E -w 40% -h 60% 'w=$(tmux list-windows -F "#{window_id} #{window_name}" | fzf --reverse --with-nth 2.. --prompt "window> ") && tmux select-window -t "${w%% *}"'
