<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eceff4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#242933" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="tower" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>tower</title>
    <style>
      /* Read at a glance from arm's length (the maintainer, 2026-11-13): big type, one line per item, details on click.
         Nord, like the maintainer's tmux bar. Colour means a state, always beside its word: frost = live on dev, green =
         ready / done, yellow = needs you / held, red = failed, purple = PR in flight, orange = deploying. */
      :root {
        --bg: #eceff4;
        --panel: #ffffff;
        --ink: #2e3440;
        --ink2: #4c566a;
        --line: #d8dee9;
        --dev: #3b7e94;
        --build: #5e81ac;
        --good: #3f7a2e;
        --hold: #9a6b00;
        --bad: #b23a46;
        --pr: #8a5a86;
        --deploy: #b5582d;
        --dim: #7b8394;
        --tint: 13%;
        --series: #5e81ac;
        --mark: #c3cad6;
        --shadow: 0 1px 2px rgba(46, 52, 64, 0.08), 0 4px 14px rgba(46, 52, 64, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #242933;
          --panel: #2e3440;
          --ink: #eceff4;
          --ink2: #a8b1c2;
          --line: #3b4252;
          --dev: #88c0d0;
          --build: #81a1c1;
          --good: #a3be8c;
          --hold: #ebcb8b;
          --bad: #e07d87;
          --pr: #c7a1c1;
          --deploy: #e0976f;
          --dim: #8790a3;
          --tint: 16%;
          --series: #88c0d0;
          --mark: #4c566a;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.18);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        font:
          17px/1.35 -apple-system,
          BlinkMacSystemFont,
          'Helvetica Neue',
          sans-serif;
      }
      button {
        font: inherit;
        font-size: 14px;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 12px;
        cursor: pointer;
      }
      a {
        color: var(--build);
      }

      header {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: calc(env(safe-area-inset-top, 0px) + 12px) max(18px, env(safe-area-inset-right))
          10px max(18px, env(safe-area-inset-left));
      }
      header h1 {
        font-size: 21px;
        margin: 0;
        letter-spacing: 0.02em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header .meta {
        color: var(--ink2);
        font-size: 14px;
        white-space: nowrap;
      }
      header button {
        white-space: nowrap;
      }
      #ctx-chip {
        max-width: 32ch;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      header .spacer {
        flex: 1;
      }
      #banner {
        display: none;
        padding: 10px 18px;
        background: color-mix(in srgb, var(--bad) 18%, var(--panel));
        color: var(--bad);
        font-weight: 600;
      }

      /* the colour of a state: --c drives text, tint and bar */
      .c-dev {
        --c: var(--dev);
      }
      .c-build {
        --c: var(--build);
      }
      .c-good {
        --c: var(--good);
      }
      .c-hold {
        --c: var(--hold);
      }
      .c-bad {
        --c: var(--bad);
      }
      .c-pr {
        --c: var(--pr);
      }
      .c-deploy {
        --c: var(--deploy);
      }
      .c-dim {
        --c: var(--dim);
      }

      /* the live dot: pulses on work in flight (still under prefers-reduced-motion) */
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--c, var(--good));
        display: inline-block;
        flex: none;
        align-self: center;
      }
      .dot.live {
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--c, var(--good)) 55%, transparent);
        }
        50% {
          box-shadow: 0 0 0 6px color-mix(in srgb, var(--c, var(--good)) 0%, transparent);
        }
      }

      /* the health strip: hero numbers, always above the fold */
      #health {
        display: grid;
        grid-template-columns: 0.8fr 1fr 1fr 0.9fr;
        gap: 10px;
        padding: 0 18px 12px;
      }
      @media (max-width: 1000px) {
        #health {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      .tile {
        position: relative;
        background: var(--panel);
        border-radius: 12px;
        padding: 9px 13px 8px;
        cursor: pointer;
        min-width: 0;
        box-shadow: var(--shadow);
        border-top: 3px solid var(--c, var(--line));
        overflow: hidden;
      }
      .tile .label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.09em;
        color: var(--ink2);
      }
      .tile .value {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-variant-numeric: tabular-nums;
      }
      .tile .value small {
        font-size: 15px;
        font-weight: 500;
        color: var(--ink2);
      }
      .tile .sub {
        font-size: 14px;
        color: var(--ink2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile.c-hold .sub,
      .tile.c-bad .sub {
        color: var(--c);
      }
      /* the MAC tile's battery / Low Power Mode / thermal line (F120): red only for its own alert */
      .tile .sub.power,
      .tile.calm-mem .sub:not(.power) {
        color: var(--ink2);
      }
      .tile .sub.power.alert {
        color: var(--c);
        font-weight: 700;
      }
      .tile .more {
        display: none;
        margin-top: 6px;
        font-size: 14px;
      }
      .tile.open .more {
        display: block;
      }
      .tile.open .value,
      .tile.open .sub {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .tile svg.spark {
        position: absolute;
        right: 10px;
        top: 12px;
        width: 42%;
        height: 38px;
        opacity: 0.9;
      }
      .tile svg.spark.none {
        display: none;
      }
      .tile.cheer {
        animation: cheer 2.4s ease-out;
      }
      @keyframes cheer {
        0% {
          box-shadow:
            0 0 0 0 color-mix(in srgb, var(--good) 70%, transparent),
            var(--shadow);
          transform: translateY(-2px);
        }
        100% {
          box-shadow:
            0 0 0 18px transparent,
            var(--shadow);
          transform: none;
        }
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
        padding: 0 max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
      }
      @media (min-width: 1000px) {
        main {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
        .wide {
          grid-column: 1 / -1;
        }
      }
      section {
        background: var(--panel);
        border-radius: 12px;
        padding: 10px 14px;
        min-width: 0;
        box-shadow: var(--shadow);
      }
      section h2 {
        font-size: 13px;
        letter-spacing: 0.09em;
        margin: 0 0 6px;
        color: var(--ink2);
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      section h2 .count {
        color: var(--ink);
      }
      section h2 .age {
        font-weight: 400;
        letter-spacing: 0;
        margin-left: auto;
        font-size: 13px;
      }
      #needs.has {
        box-shadow:
          inset 0 0 0 2px var(--hold),
          var(--shadow);
      }
      #needs.has h2 {
        color: var(--hold);
      }

      .item {
        border-radius: 8px;
      }
      .item.flash {
        animation: flash 1.8s ease-out;
      }
      @keyframes flash {
        from {
          background: color-mix(in srgb, var(--c, var(--build)) 30%, transparent);
        }
        to {
          background: transparent;
        }
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 6px 6px 6px 10px;
        border-left: 3px solid var(--c, transparent);
        cursor: pointer;
        min-width: 0;
        border-radius: 6px;
      }
      @media (hover: hover) {
        .row:hover {
          background: color-mix(in srgb, var(--c, var(--build)) 7%, transparent);
        }
      }
      .row .text {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .meta {
        color: var(--ink2);
        font-size: 14px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .row .who {
        color: var(--ink2);
        font-size: 15px;
      }
      .more {
        display: none;
        padding: 2px 6px 8px 13px;
        font-size: 15px;
        color: var(--ink2);
        overflow-wrap: anywhere;
      }
      .item.open .row .text {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .item.open .more {
        display: block;
      }
      .more code {
        display: block;
        font:
          13px ui-monospace,
          Menlo,
          monospace;
        background: var(--bg);
        border-radius: 6px;
        padding: 6px 8px;
        margin: 6px 0;
        white-space: pre-wrap;
        color: var(--ink);
      }
      .badge {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 2px 8px;
        border-radius: 999px;
        white-space: nowrap;
        color: var(--c, var(--dim));
        background: color-mix(in srgb, var(--c, var(--dim)) var(--tint), transparent);
      }
      .t-good {
        color: var(--good);
      }
      .t-warn {
        color: var(--hold);
      }
      .t-bad {
        color: var(--bad);
      }
      .t-dim {
        color: var(--ink2);
      }
      .serving {
        cursor: pointer; /* tappable on iOS (five taps: the status-bar readout) */
        touch-action: manipulation;
      }
      .empty {
        color: var(--ink2);
        padding: 4px 0 4px 13px;
      }
      .cant {
        color: var(--bad);
        padding: 4px 0 4px 13px;
      }
      .cant.behind {
        color: var(--hold);
      }
      .showall {
        margin: 4px 0 0 10px;
      }

      /* the phase track: plan › build › gate › review › local › dev › pr › merged, the current step lit */
      .track {
        display: inline-flex;
        gap: 3px;
        align-self: center;
        flex: none;
      }
      .track i {
        width: 13px;
        height: 6px;
        border-radius: 3px;
        background: var(--line);
      }
      .track i.done {
        background: color-mix(in srgb, var(--c, var(--build)) 45%, var(--line));
      }
      .track i.now {
        background: var(--c, var(--build));
      }
      @media (max-width: 700px) {
        .track {
          display: none;
        }
      }

      .slots {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 6px;
      }
      .slot {
        border-radius: 10px;
        padding: 7px 11px;
        min-width: 0;
        cursor: pointer;
        background: color-mix(in srgb, var(--c, var(--dim)) 9%, var(--panel));
        border: 1px solid color-mix(in srgb, var(--c, var(--dim)) 30%, transparent);
      }
      .slot .name {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.09em;
        color: var(--c);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .slot .who {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .slot .what {
        font-size: 14px;
        color: var(--ink2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-variant-numeric: tabular-nums;
      }
      .slot .more {
        display: none;
        padding: 2px 0 0;
        font-size: 14px;
      }
      .slot.open .more {
        display: block;
      }
      .slot.open .who,
      .slot.open .what {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .only-phone {
        display: none;
      }

      #slipping h2,
      #sources h2 {
        cursor: pointer;
        margin: 0;
      }
      #slipping .body,
      #sources .body {
        display: none;
        margin-top: 6px;
      }
      #slipping.open .body,
      #sources.open .body {
        display: block;
      }
      .kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 2px 10px;
      }
      .kv .k {
        color: var(--ink2);
      }

      #charts {
        display: none;
      }
      #charts.on {
        display: block;
      }
      .chart {
        position: relative;
        margin: 6px 0 12px;
      }
      .chart canvas {
        width: 100%;
        height: 120px;
        display: block;
      }
      .chart .tip {
        position: absolute;
        top: 0;
        pointer-events: none;
        font-size: 13px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 6px;
        display: none;
        white-space: nowrap;
      }
      .chart .title {
        font-size: 14px;
        color: var(--ink2);
      }

      /* Expand (TOWER.md → Expand): one panel full screen, a strip of the others' headline numbers kept on top. */
      section h2.exp {
        cursor: pointer;
      }
      @media (hover: hover) {
        section h2.exp:hover::after {
          content: '⤢';
          margin-left: 2px;
        }
      }
      #strip {
        display: none;
        position: sticky;
        top: env(
          safe-area-inset-top,
          0px
        ); /* a Home Screen app: below the status bar, so ✕ stays tappable */
        z-index: 5;
        gap: 8px;
        align-items: center;
        overflow-x: auto;
        background: var(--bg);
        padding: 6px max(18px, env(safe-area-inset-right)) 8px max(18px, env(safe-area-inset-left));
        scrollbar-width: none;
      }
      body[data-open] #strip {
        display: flex;
      }
      #strip .title {
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.09em;
        white-space: nowrap;
        margin-right: 4px;
      }
      #strip .chip {
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        flex: none;
      }
      #strip .chip .k {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--ink2);
      }
      #strip .close {
        flex: none;
        font-weight: 700;
      }
      body[data-open] #health,
      body[data-open] main > section:not(.x-open) {
        display: none !important;
      }
      body[data-open] main {
        grid-template-columns: minmax(0, 1fr);
      }
      #slipping.x-open .body,
      #sources.x-open .body {
        display: block;
      }
      section.x-open {
        min-height: 60vh;
      }
      section h3 {
        font-size: 12px;
        letter-spacing: 0.09em;
        color: var(--ink2);
        margin: 14px 0 4px 10px;
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      section h3 .age {
        font-weight: 400;
        letter-spacing: 0;
      }
      .row .you {
        font-size: 13px;
        font-weight: 600;
        color: var(--hold);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 16em;
      }
      .slip {
        color: var(--hold);
        font-weight: 600;
      }
      /* the plan table: Time | What | You */
      table.plan {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      table.plan th {
        text-align: left;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--ink2);
        padding: 4px 8px;
        border-bottom: 1px solid var(--line);
      }
      table.plan td {
        padding: 7px 8px;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      table.plan td.time {
        white-space: nowrap;
        width: 1%;
        font-weight: 600;
      }
      table.plan td.time .eta,
      table.plan td.time .src {
        font-weight: 400;
        font-size: 13px;
        color: var(--ink2);
      }
      table.plan td.time .src.guess {
        color: var(--hold);
      }
      table.plan td.you {
        width: 22%;
        color: var(--hold);
        font-weight: 600;
      }
      table.plan td .who {
        color: var(--ink2);
        font-size: 14px;
      }
      table.plan td .actual {
        font-size: 13px;
        color: var(--ink2);
        text-decoration: none;
        display: block;
      }
      table.plan tr.done td.time,
      table.plan tr.done td.what > span:first-child,
      table.plan tr.done td.you {
        text-decoration: line-through;
        color: var(--dim);
      }
      table.plan tr.slipping {
        background: color-mix(in srgb, var(--hold) 9%, transparent);
      }
      table.plan tr.nowline td {
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--bad);
        border-bottom: 2px solid var(--bad);
      }
      ul.notes {
        margin: 10px 0 4px;
        padding-left: 28px;
        color: var(--ink2);
      }
      ul.notes li {
        margin: 3px 0;
        overflow-wrap: anywhere;
      }
      /* the step bar: a pip per planned step, the current one filling with its time against its estimate */
      .track.steps i {
        position: relative;
        overflow: hidden;
      }
      .track.steps i.now {
        background: color-mix(in srgb, var(--c, var(--build)) 30%, var(--line));
      }
      .track.steps i.now b {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--c, var(--build));
      }
      .track.steps i.now.over b {
        background: var(--hold);
      }

      @media (prefers-reduced-motion: reduce) {
        .dot.live,
        .item.flash,
        .tile.cheer {
          animation: none;
        }
      }

      /* F161's status-bar readout (app.js debugReadout): above everything, inside the bottom safe area */
      #dbg {
        position: fixed;
        z-index: 50;
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        bottom: max(8px, env(safe-area-inset-bottom));
        margin: 0;
        padding: 8px 10px;
        font:
          12px/1.4 ui-monospace,
          Menlo,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--ink);
        background: var(--panel);
        border: 2px solid var(--dev);
        border-radius: 8px;
      }

      /* The phone (a Home Screen web app, 390–440 px): nothing is cut off. Text that CSS would clip wraps; a row
         whose first clause is all it shows has a › and its full text one tap away; Mac-only buttons say where they
         run instead. The desktop never reaches this width. */
      @media (max-width: 700px) {
        header {
          gap: 8px;
          padding: calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right))
            8px max(12px, env(safe-area-inset-left));
        }
        /* Installed, upright: never under the status bar, even when iOS reports a 0 inset (WebKit bug 301994).
           62px is a Dynamic Island phone's inset (54px bar); iOS may report fullscreen (WebKit bug 264218). Above
           700px or sideways no installed screen has such a bar, so the floor stays here. */
        @media (display-mode: standalone) and (orientation: portrait),
          (display-mode: fullscreen) and (orientation: portrait) {
          header {
            padding-top: calc(max(env(safe-area-inset-top, 0px), 62px) + 8px);
          }
          /* an expanded panel's strip sticks below that bar too */
          #strip {
            top: max(env(safe-area-inset-top, 0px), 62px);
          }
        }
        /* the same floor when app.js finds the page installed (navigator.standalone) but display-mode didn't match */
        @media (orientation: portrait) {
          html.installed header {
            padding-top: calc(max(env(safe-area-inset-top, 0px), 62px) + 8px);
          }
          html.installed #strip {
            top: max(env(safe-area-inset-top, 0px), 62px);
          }
        }
        header h1 {
          font-size: 19px;
        }
        header .ver {
          display: none;
        }
        button {
          min-height: 32px;
        }
        #health {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
          padding: 0 max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
        }
        .tile.k-aws {
          order: 1;
        }
        .tile.k-container,
        .tile.k-mac {
          order: 2;
        }
        .tile {
          padding: 7px 10px 6px;
        }
        .tile .value {
          font-size: 21px;
        }
        .tile .value small {
          font-size: 13px;
        }
        .tile .sub {
          font-size: 13px;
          white-space: normal;
          overflow-wrap: anywhere;
        }
        /* in the flow, between the number and its line: never over the text */
        .tile svg.spark {
          position: static;
          display: block;
          width: 100%;
          height: 20px;
          margin: 2px 0;
        }
        main {
          padding: 0 max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom))
            max(12px, env(safe-area-inset-left));
        }
        section {
          padding: 9px 10px;
        }
        .row {
          flex-wrap: wrap;
          row-gap: 2px;
          gap: 8px;
          padding: 6px 4px 6px 8px;
        }
        .row .text {
          flex: 1 1 14em;
          white-space: normal;
          overflow-wrap: anywhere;
        }
        /* the chevron sits in the row's top-right corner, so a wrapped row never leaves it alone on a line */
        .item.has-more > .row {
          position: relative;
          padding-right: 20px;
        }
        .item.has-more > .row::after {
          content: '›';
          color: var(--ink2);
          position: absolute;
          right: 6px;
          top: 6px;
          transition: transform 0.15s;
        }
        .item.has-more.open > .row::after {
          transform: rotate(90deg);
        }
        .slots {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        .slot {
          padding: 6px 10px;
          display: flex;
          flex-wrap: wrap;
          column-gap: 8px;
          align-items: baseline;
        }
        .slot .who,
        .slot .what {
          white-space: normal;
          overflow-wrap: anywhere;
        }
        .slot .what,
        .slot .more {
          flex: 1 1 100%;
        }
        .slot .what.asof {
          display: none;
        }
        .only-desk {
          display: none;
        }
        .only-phone {
          display: inline;
        }
        /* a stale board joins the sources chip on the phone (app.js sources()): the worse tone shows */
        #sources-chip.phone-t-warn {
          color: var(--hold);
        }
        #sources-chip.phone-t-bad {
          color: var(--bad);
        }
        #strip {
          padding: 6px max(12px, env(safe-area-inset-right)) 8px
            max(12px, env(safe-area-inset-left));
          gap: 6px;
        }
        /* the sheet: the expanded panel fills the screen edge to edge */
        body[data-open] main {
          padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
            env(safe-area-inset-left, 0px);
        }
        body[data-open] main > section.x-open,
        #needs.has.x-open {
          border-radius: 0;
          box-shadow: none;
          min-height: calc(100vh - 100px);
        }
        table.plan td,
        table.plan th {
          padding: 6px 5px;
        }
        table.plan td.you {
          width: 26%;
        }
        .row .you {
          white-space: normal;
          overflow-wrap: anywhere;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1><span class="dot c-dim" id="live-dot"></span>tower</h1>
      <span class="meta" id="meta">loading…</span>
      <span class="spacer"></span>
      <span class="meta only-desk" id="ctx-chip" hidden></span>
      <span class="meta only-desk" id="usage-chip" hidden></span>
      <button id="board-chip" type="button" hidden>board</button>
      <button id="sources-chip" type="button">sources</button>
      <button id="charts-toggle" type="button">charts</button>
    </header>
    <div id="banner"></div>
    <nav id="strip" aria-label="other panels"></nav>
    <div id="health"></div>
    <main>
      <section id="needs">
        <h2>NEEDS YOU <span class="count"></span><span class="age"></span></h2>
        <div class="body"></div>
      </section>
      <section id="now">
        <h2>NOW <span class="age"></span></h2>
        <div class="body"></div>
      </section>
      <section id="next">
        <h2>NEXT</h2>
        <div class="body"></div>
      </section>
      <section id="done">
        <h2>DONE TODAY <span class="age"></span></h2>
        <div class="body"></div>
      </section>
      <section id="slipping" class="wide">
        <h2>SLIPPING <span class="count"></span><span class="age">click to show</span></h2>
        <div class="body"></div>
      </section>
      <section id="charts" class="wide">
        <h2>LOAD <span class="age">container: last 24 h · Mac: since the server started</span></h2>
        <div class="body"></div>
      </section>
      <section id="sources" class="wide">
        <h2>SOURCES <span class="count"></span><span class="age">click to show</span></h2>
        <div class="body"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
