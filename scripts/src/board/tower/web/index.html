<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>tower</title>
    <style>
      /* Read at a glance from arm's length on a 14" screen (1512 px) or an iTerm pane: big type, one line per
         item, details on click. Status colours always come with a word. */
      :root {
        --bg: #f6f6f4;
        --panel: #ffffff;
        --ink: #111110;
        --ink2: #5c5b57;
        --line: #e2e1dc;
        --good: #0a7d0a;
        --warn: #8a5a00;
        --bad: #c22f2f;
        --warn-bg: #fff4d6;
        --bad-bg: #fde8e8;
        --good-bg: #e6f6e6;
        --dim-bg: #efeeea;
        --series: #2a78d6;
        --mark: #b5b3ad;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161615;
          --panel: #1f1f1d;
          --ink: #f0efec;
          --ink2: #a9a89f;
          --line: #34342f;
          --good: #4cc94c;
          --warn: #f2b84b;
          --bad: #ef6b6b;
          --warn-bg: #3a3014;
          --bad-bg: #3d1e1e;
          --good-bg: #1d331d;
          --dim-bg: #2a2a27;
          --series: #3987e5;
          --mark: #6b6a64;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          17px/1.35 -apple-system,
          BlinkMacSystemFont,
          'Helvetica Neue',
          sans-serif;
      }
      button {
        font: inherit;
        font-size: 14px;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 10px;
        cursor: pointer;
      }
      a {
        color: var(--series);
      }

      header {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 10px 18px;
      }
      header h1 {
        font-size: 20px;
        margin: 0;
      }
      header .meta {
        color: var(--ink2);
        font-size: 14px;
      }
      header .spacer {
        flex: 1;
      }
      #banner {
        display: none;
        padding: 10px 18px;
        background: var(--bad-bg);
        color: var(--bad);
        font-weight: 600;
      }

      /* the health strip: always above the fold */
      #health {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        padding: 0 18px 10px;
      }
      @media (max-width: 1000px) {
        #health {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      .tile {
        background: var(--panel);
        border: 1px solid var(--line);
        border-left-width: 5px;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
        min-width: 0;
      }
      .tile.s-warn {
        border-left-color: var(--warn);
      }
      .tile.s-bad {
        border-left-color: var(--bad);
      }
      .tile.s-good {
        border-left-color: var(--good);
      }
      .tile.s-dim {
        border-left-color: var(--mark);
      }
      .tile .label {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--ink2);
      }
      .tile.s-warn .sub {
        color: var(--warn);
      }
      .tile.s-bad .sub {
        color: var(--bad);
      }
      .tile .value {
        font-size: 21px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile .sub {
        font-size: 14px;
        color: var(--ink2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile .more {
        display: none;
        margin-top: 6px;
        font-size: 14px;
      }
      .tile.open .more {
        display: block;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
        padding: 0 18px 18px;
      }
      @media (min-width: 1000px) {
        main {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
        .wide {
          grid-column: 1 / -1;
        }
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 14px;
        min-width: 0;
      }
      section h2 {
        font-size: 14px;
        letter-spacing: 0.07em;
        margin: 0 0 6px;
        color: var(--ink2);
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      section h2 .count {
        color: var(--ink);
      }
      section h2 .age {
        font-weight: 400;
        letter-spacing: 0;
        margin-left: auto;
        font-size: 13px;
      }
      #needs.has {
        border-color: var(--warn);
        border-width: 2px;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 6px 0;
        border-top: 1px solid var(--line);
        cursor: pointer;
        min-width: 0;
      }
      .row:first-child {
        border-top: 0;
      }
      .row .text {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .meta {
        color: var(--ink2);
        font-size: 14px;
        white-space: nowrap;
      }
      .row .who {
        color: var(--ink2);
        font-size: 15px;
      }
      .more {
        display: none;
        padding: 2px 0 8px;
        font-size: 15px;
        color: var(--ink2);
        overflow-wrap: anywhere;
      }
      .item.open .row .text {
        white-space: normal;
      }
      .item.open .more {
        display: block;
      }
      .more code {
        display: block;
        font:
          13px ui-monospace,
          Menlo,
          monospace;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
        margin: 6px 0;
        white-space: pre-wrap;
        color: var(--ink);
      }
      .badge {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.03em;
        padding: 2px 7px;
        border-radius: 5px;
        white-space: nowrap;
      }
      .t-good {
        color: var(--good);
      }
      .t-warn {
        color: var(--warn);
      }
      .t-bad {
        color: var(--bad);
      }
      .t-dim {
        color: var(--ink2);
      }
      .badge.t-good {
        background: var(--good-bg);
      }
      .badge.t-warn {
        background: var(--warn-bg);
      }
      .badge.t-bad {
        background: var(--bad-bg);
      }
      .badge.t-dim,
      .badge.t-normal {
        background: var(--dim-bg);
        color: var(--ink2);
      }
      .empty {
        color: var(--ink2);
        padding: 4px 0;
      }
      .cant {
        color: var(--bad);
        padding: 4px 0;
      }
      .showall {
        margin-top: 4px;
      }

      .slots {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 4px;
      }
      .slot {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        min-width: 0;
      }
      .slot .name {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--ink2);
      }
      .slot .who,
      .slot .what {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .slot .what {
        font-size: 15px;
        color: var(--ink2);
      }

      #slipping h2,
      #sources h2 {
        cursor: pointer;
        margin: 0;
      }
      #slipping .body,
      #sources .body {
        display: none;
        margin-top: 6px;
      }
      #slipping.open .body,
      #sources.open .body {
        display: block;
      }
      .kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 2px 10px;
      }
      .kv .k {
        color: var(--ink2);
      }

      #charts {
        display: none;
      }
      #charts.on {
        display: block;
      }
      .chart {
        position: relative;
        margin: 6px 0 12px;
      }
      .chart canvas {
        width: 100%;
        height: 120px;
        display: block;
      }
      .chart .tip {
        position: absolute;
        top: 0;
        pointer-events: none;
        font-size: 13px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 6px;
        display: none;
        white-space: nowrap;
      }
      .chart .title {
        font-size: 14px;
        color: var(--ink2);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>tower</h1>
      <span class="meta" id="meta">loading…</span>
      <span class="spacer"></span>
      <button id="sources-chip" type="button">sources</button>
      <button id="charts-toggle" type="button">charts</button>
    </header>
    <div id="banner"></div>
    <div id="health"></div>
    <main>
      <section id="needs">
        <h2>NEEDS YOU <span class="count"></span><span class="age"></span></h2>
        <div class="body"></div>
      </section>
      <section id="now">
        <h2>NOW <span class="age"></span></h2>
        <div class="body"></div>
      </section>
      <section id="next">
        <h2>NEXT</h2>
        <div class="body"></div>
      </section>
      <section id="done">
        <h2>DONE TODAY <span class="age"></span></h2>
        <div class="body"></div>
      </section>
      <section id="slipping" class="wide">
        <h2>SLIPPING <span class="count"></span><span class="age">click to show</span></h2>
        <div class="body"></div>
      </section>
      <section id="charts" class="wide">
        <h2>LOAD <span class="age">container: last 24 h · Mac: since the server started</span></h2>
        <div class="body"></div>
      </section>
      <section id="sources" class="wide">
        <h2>SOURCES <span class="count"></span><span class="age">click to show</span></h2>
        <div class="body"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
