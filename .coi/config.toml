# code-on-incus config for Aperture — <aperture>/.coi/config.toml (project config → run `coi trust`).
# VL-free, secret-free (token injected via env). Daytime base; night profile is a separate file (later).
# Validated against `coi schema profile` on the installed COI (v0.12.0, Incus 7.4) — not the wiki (stale on forward_env).

[container]
image      = "coi-default"   # Node 22 + pnpm + jq + git; only chromium missing (defer)
persistent = true           # reused across `coi shell` exits; `coi shutdown` deletes it, and ~/.coi is VM-local so a VM rebuild wipes it too
alias      = "aperture"

[tool]
name            = "claude"
permission_mode = "bypass"   # == --dangerously-skip-permissions; safe only because the container is the boundary

[limits.cpu]
count     = "6"      # pin all 6 vCPUs
allowance = "80%"    # cap burst so guest OS + COI monitor aren't starved

[limits.memory]
limit = "12GiB"
swap  = "4GiB"

[limits.runtime]
max_processes = 2048   # integer, not a quoted string
# max_duration — night profile only

[network]
mode = "restricted"   # CONFIRMED by your run output

[[ports.map]]
name      = "vite"
container = 6173
host      = 6173
